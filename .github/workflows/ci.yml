name: CI Test & Architecture Gate

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'assets/**'
      - '*.md'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'assets/**'
      - '*.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

jobs:
  test:
    name: Unit & Race Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CodeDNA
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Web Dependencies & Build
        run: |
          cd web
          npm ci
          npm run build

      - name: Run Go Tests with Race Detector
        run: |
          go test -v -race ./...

      - name: Build CodeDNA CLI Binary
        run: |
          make build-cli

      - name: Architecture Quality Gate Check
        run: |
          ./bin/codedna check --min-health=80 --max-cycles=0
